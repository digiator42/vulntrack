name: Vulntrack Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**' # Triggers only on backend changes
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Setting the working directory to backend so mvnw commands run correctly
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Speeds up future runs by caching dependencies

      - name: Grant Execute Permission for Maven
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test