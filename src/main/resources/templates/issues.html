<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: mainLayout(~{::div})}">
<div class="w-4/5">
    <h2 class="text-3xl font-bold mb-6 text-gray-800">System Issues</h2>
    <div class="bg-white shadow-lg rounded-xl overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                    <th class="p-4 font-semibold text-gray-600">ID</th>
                    <th class="p-4 font-semibold text-gray-600">Title</th>
                    <th class="p-4 font-semibold text-gray-600">Severity</th>
                    <th class="p-4 font-semibold text-gray-600">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="issue : ${issues}" class="hover:bg-blue-50/50 transition border-b">
                    <td class="p-4 font-mono text-sm text-gray-500" th:text="${issue.id}">0</td>
                    <td class="p-4 font-medium" th:text="${issue.title}">Title</td>
                    <td class="p-4">
                        <span th:text="${issue.severity}"
                            th:classappend="${issue.severity == 'HIGH' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}"
                            class="px-2 py-1 rounded text-xs font-bold uppercase">
                        </span>
                    </td>
                    <td class="p-4 text-sm text-gray-600" th:text="${issue.status ?: 'OPEN'}">OPEN</td>
                </tr>
                <tr th:if="${#lists.isEmpty(issues)}">
                    <td colspan="4" class="p-12 text-center text-gray-400">No issues found.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="flex justify-center items-center gap-2 mt-8">
        <a th:if="${currentPage > 0}" th:href="@{/web/issues(page=${currentPage - 1}, size=${pageSize})}"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
            Previous
        </a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="flex gap-1">
            <a th:href="@{/web/issues(page=${i}, size=${pageSize})}" th:text="${i + 1}"
                th:classappend="${i == currentPage} ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'"
                class="px-3 py-2 rounded-lg transition font-semibold">
            </a>
        </span>

        <a th:if="${currentPage < totalPages - 1}" th:href="@{/web/issues(page=${currentPage + 1}, size=${pageSize})}"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
            Next
        </a>
    </div>
    <div class="error-container mt-6 bg-red-100 p-4 rounded-lg" th:if="${statusCode}">
        <p th:text="${errorMessage}"></p>
    </div>
</div>

</html>
