<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="mainLayout(content)">

<head>
    <meta charset="UTF-8">
    <title>VulnTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-gray-900 text-white p-6">
            <h1 class="text-xl font-bold mb-6 text-blue-400">VulnTrack</h1>
            <nav class="space-y-4">
                <a th:href="@{/web/issues}" class="block py-2 px-4 rounded hover:bg-gray-800 transition">Issues</a>
                <a th:href="@{/web/dashboard}"
                    class="block py-2 px-4 rounded hover:bg-gray-800 transition">Dashboard</a>
            </nav>
        </aside>
        <div class="flex-1 flex items-center justify-center p-8 w-3/4 h-3/4">
            <main class="flex-1 p-8" th:replace="${content}">
            </main>
        </div>
    </div>
</body>

</html>
