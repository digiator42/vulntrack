<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: mainLayout(~{::div})}">

<div>
    <h2 class="text-3xl font-bold mb-6 text-gray-800">Report New Issue</h2>

    <div class="bg-white shadow-lg rounded-xl p-8 max-w-2xl">
        <form th:action="@{/web/issues}" method="POST" class="space-y-6">

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Issue Title</label>
                <input type="text" name="title" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="e.g., SQL Injection in Login">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Severity</label>
                <select name="severity"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                    <option value="4">Critical</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                <textarea name="description" rows="4"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Describe the vulnerability..."></textarea>
            </div>

            <div class="flex gap-4">
                <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                    Submit Issue
                </button>
                <a th:href="@{/web/issues}"
                    class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-300 transition text-center">
                    Cancel
                </a>
            </div>
        </form>
        <div th:if="${message}" class="text-red-500 text-sm mb-4 text-center">
            <p th:text="${message}"></p>
        </div>
    </div>
</div>

</html>
