<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: mainLayout(~{::div})}">

<div>
    <h2 class="text-2xl font-bold mb-6">Dashboard</h2>

    <div class="grid grid-cols-4 gap-6">

        <div class="bg-white p-6 rounded shadow">
            <p class="text-gray-500">Total Issues</p>
            <p class="text-3xl font-bold" th:text="${stats['totalIssues']} ?: '0'"></p>
        </div>

        <div class="bg-white p-6 rounded shadow">
            <p class="text-gray-500">Open</p>
            <p class="text-3xl font-bold text-red-600" th:text="${stats['openIssues']} ?: '0'"></p>
        </div>

        <div class="bg-white p-6 rounded shadow">
            <p class="text-gray-500">Closed</p>
            <p class="text-3xl font-bold text-green-600" th:text="${stats['closedIssues']} ?: '0'"></p>
        </div>

        <div class="bg-white p-6 rounded shadow">
            <p class="text-gray-500">Users</p>
            <p class="text-3xl font-bold" th:text="${stats['totalUsers']} ?: '0'"></p>
        </div>

    </div>
</div>

</html>
