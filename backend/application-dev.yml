server:
  port: 8080
  
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vuluntrack_dev
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.vulntrack.service.DependencyNormalizer: DEBUG
    com.vulntrack.service.NvdClientService2: DEBUG
    root: INFO
